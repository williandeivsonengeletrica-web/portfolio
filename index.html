<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Willian Deivson | Projetos Elétricos</title>

<meta name="description" content="Projetos elétricos para arquitetos e engenheiros.">
<meta name="theme-color" content="#161616">

<!-- Fonte -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">

<style>

:root {
  --text: #ffffff;
  --muted: #a3a3a3;
  --footer: #858585;

  /* Cartão semelhante ao da imagem de referência */
  --card-bg: rgba(35, 35, 35, 0.62);
  --card-border: rgba(255, 255, 255, 0.20);
}

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  font-family:
    "Source Sans 3",
    "Source Sans Pro",
    "Segoe UI",
    system-ui,
    Arial,
    sans-serif;

  color: var(--text);

  background: #202020;

  -webkit-font-smoothing: antialiased;
  overflow: hidden;

  position: relative;

  /* Fade inicial */
  opacity: 0;
  animation: fadeIn 1.1s ease-in-out forwards;
  animation-delay: .2s;
}


/* =========================================================
   FUNDO
   FOTO REPETIDA HORIZONTALMENTE
========================================================= */

.bg {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: -1;

  /*
     IMPORTANTE:

     auto 100% = a altura da foto acompanha a tela
     e a largura permanece proporcional.

     repeat-x = repete a foto horizontalmente.

     Isso produz o efeito da primeira imagem:
     várias fotos lado a lado.
  */

  background-image:
    linear-gradient(
      rgba(0, 0, 0, 0.48),
      rgba(0, 0, 0, 0.48)
    ),
    url("foto.jpg");

  background-size:
    auto 100%,
    auto 100%;

  background-position:
    center center,
    center center;

  background-repeat:
    no-repeat,
    repeat-x;

  /*
     Deixa a fotografia em preto e branco,
     como na referência.
  */
  filter: grayscale(100%);
}


/* =========================================================
   FADE IN
========================================================= */

@keyframes fadeIn {

  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }

}


/* =========================================================
   PÁGINA
========================================================= */

.page {

  width: 100%;
  height: 100vh;

  min-height: 100vh;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: flex-end;

  /*
     Distância entre o cartão e o texto inferior.
  */
  gap: 38px;

  padding:

    24px
    20px
    max(48px, env(safe-area-inset-bottom));
}


/* =========================================================
   CARTÃO PRINCIPAL
========================================================= */

.card {

  width: 100%;

  max-width: 1015px;

  min-height: 193px;

  display: grid;

  grid-template-columns: 1fr;

  background: var(--card-bg);

  border:

    1px solid
    var(--card-border);

  border-radius: 30px;

  /*
     Efeito de vidro semelhante ao Carrd.
  */

  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);

  box-shadow:

    0 20px 50px
    rgba(0, 0, 0, 0.40);

  overflow: hidden;

  animation:
    cardEnter
    .8s
    cubic-bezier(.2,.7,.2,1)
    both;
}


/* Entrada do cartão */

@keyframes cardEnter {

  from {

    opacity: 0;

    transform:
      translateY(16px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   LADO ESQUERDO
========================================================= */

.info {

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  padding:
    36px
    24px
    28px;
}


/* Nome */

.title {

  font-size:
    clamp(
      1.9rem,
      4vw,
      2.7rem
    );

  font-style: italic;

  font-weight: 400;

  text-transform: uppercase;

  letter-spacing: -0.015em;

  line-height: 1.05;

  white-space: nowrap;
}


/* Subtítulo */

.subtitle {

  margin-top: 13px;

  font-size:
    clamp(
      1rem,
      2vw,
      1.15rem
    );

  font-weight: 400;

  text-transform: uppercase;

  color: var(--muted);

  line-height: 1.2;
}


/* =========================================================
   REDES SOCIAIS
========================================================= */

.socials {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 30px;

  padding:
    28px
    24px
    36px;

  border-top:
    1px solid
    rgba(255, 255, 255, 0.18);
}


/* =========================================================
   BOTÕES
========================================================= */

.social {

  width: 60px;

  height: 60px;

  display: grid;

  place-items: center;

  background: #ffffff;

  color: #000000;

  border-radius: 17px;

  text-decoration: none;

  flex-shrink: 0;

  transition:

    transform
    .25s
    cubic-bezier(.2,.8,.2,1),

    box-shadow
    .25s
    ease;
}


/* Ícones */

.social svg {

  width: 30px;

  height: 30px;

  fill: currentColor;

}


/* Hover */

.social:hover {

  transform:
    translateY(-4px)
    scale(1.06);

  box-shadow:
    0 12px 26px
    rgba(0, 0, 0, 0.50);
}


/* Clique */

.social:active {

  transform:
    scale(.96);
}


/* Acessibilidade */

a:focus-visible {

  outline:
    2px solid
    #ffffff;

  outline-offset: 4px;
}


/* =========================================================
   RODAPÉ
========================================================= */

.footer {

  text-align: center;

  font-size:
    clamp(
      .9rem,
      2vw,
      1.15rem
    );

  font-weight: 300;

  text-transform: uppercase;

  color: var(--footer);

  line-height: 1.5;

  white-space: nowrap;
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 760px) {

  .card {

    /*
       Duas partes exatamente como
       na primeira imagem.
    */

    grid-template-columns:
      1fr 1fr;

    min-height: 193px;
  }


  /* -----------------------------------------
     LADO ESQUERDO
  ----------------------------------------- */

  .info {

    align-items: flex-start;

    text-align: left;

    padding:

      0
      40px
      0
      110px;
  }


  /* -----------------------------------------
     LADO DIREITO
  ----------------------------------------- */

  .socials {

    position: relative;

    gap: 30px;

    padding:
      0
      24px;

    border-top: none;
  }


  /* Linha vertical */

  .socials::before {

    content: "";

    position: absolute;

    left: 0;

    top: 50%;

    width: 1px;

    height: 86px;

    transform:
      translateY(-50%);

    background:
      rgba(255, 255, 255, 0.20);
  }

}


/* =========================================================
   TELAS MENORES
========================================================= */

@media (max-width: 759px) {

  body {
    overflow-y: auto;
  }

  .page {

    min-height: 100svh;

    padding:
      24px
      16px
      40px;

    gap: 30px;
  }

  .card {

    max-width: 100%;
  }

  .title {

    font-size:
      clamp(
        1.7rem,
        8vw,
        2.3rem
      );
  }

  .social {

    width: 56px;

    height: 56px;
  }

  .socials {

    gap: 22px;
  }

  .footer {

    white-space: normal;

    max-width: 90%;
  }

}


/* =========================================================
   REDUÇÃO DE MOVIMENTO
========================================================= */

@media (prefers-reduced-motion: reduce) {

  body,
  .card {

    animation: none;
  }

  .social {

    transition: none;
  }

}

</style>
</head>


<body>


<!-- =======================================================
     FUNDO
======================================================= -->

<div
  class="bg"
  aria-hidden="true">
</div>


<!-- =======================================================
     CONTEÚDO
======================================================= -->

<main class="page">


  <!-- =====================================================
       CARTÃO
  ====================================================== -->

  <section
    class="card"
    id="card">


    <!-- ================================================
         INFORMAÇÕES
    ================================================= -->

    <div class="info">

      <h1 class="title">
        Willian Deivson
      </h1>

      <p class="subtitle">
        Projetos Elétricos
      </p>

    </div>


    <!-- ================================================
         REDES SOCIAIS
    ================================================= -->

    <nav
      class="socials"
      aria-label="Redes e contato">


      <!-- INSTAGRAM -->

      <a
        class="social"
        href="https://www.instagram.com/wd.eletric/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">

        <svg
          viewBox="0 0 24 24"

          <path d="

          "/>

      <!-- LINKEDIN -->

      <a
        class="social"
        href="https://www.linkedin.com/in/willian-deivson/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn">

        <svg
          viewBox="0 0 24 24"

            M4.98 3.5

      <!-- E-MAIL -->

        target="_blank"

        <svg

    </nav>

  </section>


  <!-- =====================================================
       RODAPÉ
  ====================================================== -->

  <footer class="footer">

    Projetos elétricos para arquitetos e engenheiros

  </footer>


</main>


<!-- =======================================================
     SCRIPT DO E-MAIL
======================================================= -->

<script>

(function () {

  var btn =
    document.getElementById("emailBtn");

  /*
     Celular:
     abre o aplicativo de e-mail.

     Computador:
     abre o Gmail no navegador.
  */

  if (
    window.matchMedia(
      "(pointer: coarse)"
    ).matches
  ) {

    btn.href =
      "mailto:williandeivson.eng.eletrica@gmail.com" +
      "?subject=Or%C3%A7amento%20de%20projeto%20el%C3%A9trico";

    btn.removeAttribute("target");

  }

})();

</script>


</body>
</html>
